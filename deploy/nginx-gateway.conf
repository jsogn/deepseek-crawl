# Place this file in Nginx's http context, normally /etc/nginx/conf.d/.
limit_req_zone $binary_remote_addr zone=deepseek_gateway:10m rate=10r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name crawl.example.com;

    ssl_certificate /etc/letsencrypt/live/crawl.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crawl.example.com/privkey.pem;

    client_max_body_size 8m;

    location / {
        limit_req zone=deepseek_gateway burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
