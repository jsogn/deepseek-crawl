services:
  gateway:
    build:
      context: .
    image: deepseek-crawl-gateway:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8787}:8787"
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?Set GATEWAY_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_UPSTREAM_URL: ${FIRECRAWL_UPSTREAM_URL:-https://api.firecrawl.dev}
      DEEPSEEK_GATEWAY_PROVIDER_MODE: ${DEEPSEEK_GATEWAY_PROVIDER_MODE:-firecrawl-first}
      DEEPSEEK_GATEWAY_CREDITS_COOLDOWN_SECONDS: ${DEEPSEEK_GATEWAY_CREDITS_COOLDOWN_SECONDS:-60}
      DEEPSEEK_GATEWAY_MAX_CONCURRENT_REQUESTS: ${DEEPSEEK_GATEWAY_MAX_CONCURRENT_REQUESTS:-100}
      DEEPSEEK_GATEWAY_MAX_PROVIDER_REQUESTS: ${DEEPSEEK_GATEWAY_MAX_PROVIDER_REQUESTS:-100}
      DEEPSEEK_GATEWAY_MAX_CRAWL_JOBS: ${DEEPSEEK_GATEWAY_MAX_CRAWL_JOBS:-10}
      DEEPSEEK_GATEWAY_MAX_RETAINED_CRAWL_JOBS: ${DEEPSEEK_GATEWAY_MAX_RETAINED_CRAWL_JOBS:-100}
      DEEPSEEK_GATEWAY_MAX_RETAINED_CRAWL_BYTES: ${DEEPSEEK_GATEWAY_MAX_RETAINED_CRAWL_BYTES:-268435456}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
